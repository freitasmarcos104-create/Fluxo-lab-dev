name: Build Fluxo Lab installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'android/**'
      - '.github/workflows/build-installers.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE (principal)
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
        working-directory: desktop
      - name: Build Windows installer
        run: npm run dist:win
        working-directory: desktop
      - name: Publish Windows installer to official R2

        shell: bash
        env:
          GH_PUBLISH_TOKEN: ${{ github.token }}
          PUBLISH_BASE: https://fluxo-lab-upload-once-20261115.trainingmav.workers.dev
        run: |
          EXE="$(find desktop/dist -maxdepth 1 -name '*.exe' -print -quit)"
          test -n "$EXE"
          node --input-type=module - "$EXE" <<'NODE'
          import fs from 'node:fs';
          const [file] = process.argv.slice(2);
          const base = process.env.PUBLISH_BASE;
          const headers = { Authorization: `Bearer ${process.env.GH_PUBLISH_TOKEN}` };
          async function call(path, options={}) {
            const response = await fetch(base + path, { ...options, headers: { ...headers, ...(options.headers || {}) } });
            const data = await response.json();
            if (!response.ok) throw new Error(JSON.stringify(data));
            return data;
          }
          const { uploadId } = await call('/begin?kind=windows', { method: 'POST' });
          const parts = [];
          let partNumber = 1;
          try {
            for await (const chunk of fs.createReadStream(file, { highWaterMark: 8 * 1024 * 1024 })) {
              const part = await call(`/part?kind=windows&uploadId=${encodeURIComponent(uploadId)}&partNumber=${partNumber}`, {
                method: 'PUT', body: chunk, headers: { 'Content-Type': 'application/octet-stream' }
              });
              parts.push({ partNumber, etag: part.etag });
              partNumber++;
            }
            const result = await call(`/finish?kind=windows&uploadId=${encodeURIComponent(uploadId)}`, {
              method: 'POST', body: JSON.stringify(parts), headers: { 'Content-Type': 'application/json' }
            });
            process.stdout.write(JSON.stringify(result) + '\\n');
          } catch (error) {
            try { await call(`/abort?kind=windows&uploadId=${encodeURIComponent(uploadId)}`, { method: 'POST' }); } catch {}
            throw error;
          }
          NODE
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: fluxo-lab-windows-exe-0.1.5
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK (assinatura permanente)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Configure Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Configure Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Check signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Assinatura ainda não configurada. O APK de produção será pulado com segurança."
          fi
      - name: Restore permanent Android key
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fluxolab-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/fluxolab-release.p12" >> "$GITHUB_ENV"
      - name: Build signed Android APK
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # PKCS12 usa a mesma senha para o arquivo e para a chave privada.
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
        working-directory: android
      - name: Publish signed Android APK to official R2

        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          GH_PUBLISH_TOKEN: ${{ github.token }}
          PUBLISH_BASE: https://fluxo-lab-upload-once-20261115.trainingmav.workers.dev
        run: |
          node --input-type=module - android/app/build/outputs/apk/release/app-release.apk <<'NODE'
          import fs from 'node:fs';
          const [file] = process.argv.slice(2);
          const base = process.env.PUBLISH_BASE;
          const headers = { Authorization: `Bearer ${process.env.GH_PUBLISH_TOKEN}` };
          async function call(path, options={}) {
            const response = await fetch(base + path, { ...options, headers: { ...headers, ...(options.headers || {}) } });
            const data = await response.json();
            if (!response.ok) throw new Error(JSON.stringify(data));
            return data;
          }
          const { uploadId } = await call('/begin?kind=android', { method: 'POST' });
          const parts = [];
          let partNumber = 1;
          try {
            for await (const chunk of fs.createReadStream(file, { highWaterMark: 8 * 1024 * 1024 })) {
              const part = await call(`/part?kind=android&uploadId=${encodeURIComponent(uploadId)}&partNumber=${partNumber}`, {
                method: 'PUT', body: chunk, headers: { 'Content-Type': 'application/vnd.android.package-archive' }
              });
              parts.push({ partNumber, etag: part.etag });
              partNumber++;
            }
            const result = await call(`/finish?kind=android&uploadId=${encodeURIComponent(uploadId)}`, {
              method: 'POST', body: JSON.stringify(parts), headers: { 'Content-Type': 'application/json' }
            });
            process.stdout.write(JSON.stringify(result) + '\\n');
          } catch (error) {
            try { await call(`/abort?kind=android&uploadId=${encodeURIComponent(uploadId)}`, { method: 'POST' }); } catch {}
            throw error;
          }
          NODE
      - name: Upload signed Android APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fluxo-lab-android-apk-0.1.5-assinado
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Report missing Android signing setup
        if: steps.signing.outputs.available != 'true'
        run: echo "Configure os quatro segredos do Android no GitHub para gerar o APK assinado."
