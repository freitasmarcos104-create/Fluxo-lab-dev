name: Build Fluxo Lab installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'android/**'
      - '.github/workflows/build-installers.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Windows EXE (homologação)
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
        working-directory: desktop
      - name: Build Windows installer
        run: npm run dist:win
        working-directory: desktop
      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: fluxo-lab-windows-exe-homologacao
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK debug (homologação)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Configure Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Configure Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: android
      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: fluxo-lab-android-apk-homologacao
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
