name: Validate Fluxo Lab applications

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'android/**'
      - '.github/workflows/validate-applications.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'android/**'
      - '.github/workflows/validate-applications.yml'

permissions:
  contents: read

jobs:
  desktop-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check Electron JavaScript
        run: node --check main.js && node -e "JSON.parse(require('fs').readFileSync('config.json','utf8')); JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('Configurações válidas.')"
        working-directory: desktop

  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Compile Android test variant
        run: gradle --no-daemon assembleDebug
        working-directory: android
