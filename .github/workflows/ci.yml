name: Validate Fluxo Lab source

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Worker tooling
        run: npm install --no-package-lock --no-audit --no-fund
        working-directory: worker
      - name: Check Worker syntax
        run: npm run check
        working-directory: worker
      - name: Validate Cloudflare configuration without deploying
        run: npm run check:cf
        working-directory: worker
      - name: Run core tests
        run: node --test tests/worker-core.test.mjs
      - name: Run achievements tests
        run: node --test tests/achievements.test.mjs
