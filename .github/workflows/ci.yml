name: Validate and deploy Fluxo Lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Worker tooling
        run: npm install --no-package-lock --no-audit --no-fund
        working-directory: worker
      - name: Check Worker syntax
        run: npm run check
        working-directory: worker
      - name: Validate Cloudflare configuration without deploying
        run: npm run check:cf
        working-directory: worker
      - name: Run core tests
        run: node --test tests/worker-core.test.mjs tests/curso-anatomia.test.mjs
      - name: Validate Almoxarifado D1 migration with isolated SQLite
        run: python3 tests/almoxarifado_migration.test.py
      - name: Run achievements tests
        run: node --test tests/achievements.test.mjs
      - name: Run rich notes tests
        run: node --test tests/rich-notes.test.mjs
      - name: Validate prosthesis selection views
        run: node --test tests/remessas-proteses.test.mjs
      - name: Validate remittance scan and mesh alerts
        run: node --test tests/impedimentos-remessa.test.mjs
      - name: Validate deployment safety contract
        run: node --test tests/deployment-pipeline.test.mjs

  deploy-production:
    name: Publicar Worker oficial em produção
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: worker-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Worker tooling
        run: npm install --no-package-lock --no-audit --no-fund
        working-directory: worker
      - name: Check Cloudflare deployment credential
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error title=Credencial Cloudflare ausente::Configure o segredo CLOUDFLARE_API_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Deploy único Worker de produção
        run: npm run deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "72bf422494f3d27c3561ba87daa5bd7b"
