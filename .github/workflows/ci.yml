name: Validate Fluxo Lab

# Produção é publicada somente pelo Cloudflare Workers Builds.
# GitHub Actions valida, mas nunca executa um segundo deploy.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  worker-tests:
    name: Validar Worker e testes antes da publicação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Worker tooling
        run: npm install --no-package-lock --no-audit --no-fund
        working-directory: worker
      - name: Run complete release validation
        run: npm run validate:release
        working-directory: worker
