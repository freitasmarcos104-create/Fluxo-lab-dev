name: Importar código-fonte inicial do Fluxo Lab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    name: Extrair fontes para o repositório
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Reconstruir e validar pacote de fontes
        shell: bash
        run: |
          set -euo pipefail
          test -d bootstrap/chunks
          cat bootstrap/chunks/part-*.b64 | base64 --decode > /tmp/fluxo-lab-source.zip
          unzip -t /tmp/fluxo-lab-source.zip

      - name: Extrair estrutura e registrar no Git
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fluxo-lab-source
          unzip -oq /tmp/fluxo-lab-source.zip -d /tmp/fluxo-lab-source
          rsync -a /tmp/fluxo-lab-source/ ./
          rm -rf bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de fonte para importar."
            exit 0
          fi
          git commit -m "Import initial Fluxo Lab source, apps and CI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
